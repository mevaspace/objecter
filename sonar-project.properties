# SonarQube Project Configuration
sonar.organization=mevaspace
sonar.projectKey=mevaspace_objecter
sonar.projectName=Objecter

# Source directories
sonar.sources=core/src

# Exclude directories
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/test/**,benchmark

# Test directories (optional, if you want to track tests separately)
sonar.tests=core/test
sonar.test.inclusions=**/*.spec.ts

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
