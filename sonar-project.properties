# SonarQube Project Configuration
sonar.organization=mevaspace
sonar.projectKey=mevaspace-objecter
sonar.projectName=Objecter
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src

# Exclude directories
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/test/**

# Test directories (optional, if you want to track tests separately)
# sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Ignore 'Hard-coded credentials' (S2068) in test files
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts,test/**/*
